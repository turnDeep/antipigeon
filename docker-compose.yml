services:
  antipigeon:
    build: .
    image: antipigeon:latest
    container_name: antipigeon_bot
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Mount .env so changes are reflected
      - ./.env:/app/.env
      # Mount source code for development if needed (optional)
      #- ./src:/app/src
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
